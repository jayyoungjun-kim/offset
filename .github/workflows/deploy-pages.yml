name: Production release (manual)

# QA changes must never automatically replace the live site.
# The renewed platform requires Workers; Pages cannot host its APIs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require completed QA and explicit production release
        run: |
          echo 'Production remains unchanged. Complete QA and use the approved Worker release procedure in DEPLOYMENT.md.'
          exit 1
