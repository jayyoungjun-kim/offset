<!DOCTYPE html><html lang="ko"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="/assets/index-gFYAx5cc.css" data-rsc-css-href="/assets/index-gFYAx5cc.css" data-precedence="vite-rsc/importer-resources"/><title>프로덕트 디자이너 포트폴리오 워크숍</title><meta name="description" content="채용 담당자의 관점으로 진단하고 4주 동안 리뷰와 수정을 반복하는 소규모 포트폴리오 워크숍"/>
</head><body><main class="form-page"><header class="site-header"><div class="container nav-inner"><a href="/" class="nav-logo"><svg class="animated-offset-logo nav-offset-logo" width="124" height="20" viewBox="0 0 53.568 8.64" role="img" aria-label="OFFSET"><path class="logo-letter" style="--logo-x:0px" d="M2.004 8.64C1.356 8.64 0.86 8.456 0.516 8.088C0.172 7.72 0 7.2 0 6.528V2.112C0 1.44 0.172 0.92 0.516 0.552C0.86 0.184 1.356 0 2.004 0C2.652 0 3.148 0.184 3.492 0.552C3.836 0.92 4.008 1.44 4.008 2.112V6.528C4.008 7.2 3.836 7.72 3.492 8.088C3.148 8.456 2.652 8.64 2.004 8.64ZM2.004 7.44C2.46 7.44 2.688 7.164 2.688 6.612V2.028C2.688 1.476 2.46 1.2 2.004 1.2C1.548 1.2 1.32 1.476 1.32 2.028V6.612C1.32 7.164 1.548 7.44 2.004 7.44Z"></path><path class="logo-letter" style="--logo-x:0px" d="M5.00806 0.119995H8.50006V1.32H6.32806V3.66H8.03206V4.86H6.32806V8.52H5.00806V0.119995Z"></path><path class="logo-letter" style="--logo-x:0.992px" d="M9.5 0.119995H12.992V1.32H10.82V3.66H12.524V4.86H10.82V8.52H9.5V0.119995Z"></path><path class="logo-letter" style="--logo-x:3.979px" d="M15.944 8.64C15.304 8.64 14.82 8.46 14.492 8.1C14.164 7.732 14 7.208 14 6.528V6.048H15.248V6.624C15.248 7.168 15.476 7.44 15.932 7.44C16.156 7.44 16.324 7.376 16.436 7.248C16.556 7.112 16.616 6.896 16.616 6.6C16.616 6.248 16.536 5.94 16.376 5.676C16.216 5.404 15.92 5.08 15.488 4.704C14.944 4.224 14.564 3.792 14.348 3.408C14.132 3.016 14.024 2.576 14.024 2.088C14.024 1.424 14.192 0.912 14.528 0.552C14.864 0.184 15.352 0 15.992 0C16.624 0 17.1 0.184 17.42 0.552C17.748 0.912 17.912 1.432 17.912 2.112V2.46H16.664V2.028C16.664 1.74 16.608 1.532 16.496 1.404C16.384 1.268 16.22 1.2 16.004 1.2C15.564 1.2 15.344 1.468 15.344 2.004C15.344 2.308 15.424 2.592 15.584 2.856C15.752 3.12 16.052 3.44 16.484 3.816C17.036 4.296 17.416 4.732 17.624 5.124C17.832 5.516 17.936 5.976 17.936 6.504C17.936 7.192 17.764 7.72 17.42 8.088C17.084 8.456 16.592 8.64 15.944 8.64Z"></path><path class="logo-letter" style="--logo-x:10.906px" d="M19 0.119995H22.6V1.32H20.32V3.54H22.132V4.74H20.32V7.32H22.6V8.52H19V0.119995Z"></path><path class="logo-letter" style="--logo-x:25.491px" d="M25.38 1.32H24V0.119995H28.08V1.32H26.7V8.52H25.38V1.32Z"></path></svg></a><nav class="nav-menu" aria-label="주요 메뉴"><a href="/about">About</a><a href="/workshop"><span class="workshop-menu-desktop">Portfolio Workshop</span><span class="workshop-menu-mobile">Workshop</span></a></nav></div></header><div class="container form-wrap"><a href="/workshop" class="back-link">←뒤로가기</a><form class="application-form" noValidate=""><h1>프로덕트 디자이너 포트폴리오 완성반 1기 신청서</h1><div class="field"><label for="name">이름</label><input class="text-input" id="name" placeholder="이름" aria-invalid="false" name="name"/></div><div class="field"><label for="phone">연락처</label><input class="text-input" id="phone" type="tel" placeholder="010-1234-5678" aria-invalid="false" name="phone"/></div><div class="field"><label for="email">이메일</label><input class="text-input" id="email" type="email" placeholder="portfolioworkshop@gmail.com" aria-invalid="false" name="email"/></div><div class="field" role="group" aria-labelledby="career-label" aria-invalid="false" tabindex="-1"><p class="field-label" id="career-label">현재 경력을 알려주세요</p><div class="choice-list"><label class="choice"><span>1년 미만</span><input type="radio" name="career" value="1년 미만"/></label><label class="choice"><span>1~3년</span><input type="radio" name="career" value="1~3년"/></label><label class="choice"><span>4~7년</span><input type="radio" name="career" value="4~7년"/></label><label class="choice"><span>7년 이상</span><input type="radio" name="career" value="7년 이상"/></label></div></div><div class="field" role="group" aria-labelledby="portfolio-label" aria-invalid="false" tabindex="-1"><p class="field-label" id="portfolio-label">포트폴리오 파일 첨부 또는 링크</p><input class="text-input" type="url" placeholder="https://" name="portfolioLink"/><label class="upload"><span class="upload-copy"><span>첨부할 파일을 여기에 끌어다 놓거나,<br class="upload-mobile-break"/> 파일 선택 버튼을 직접 선택해주세요.</span><span class="upload-note" role="status" aria-live="polite">파일 용량은 최대 20MB까지 첨부할 수 있습니다.</span></span><span class="file-button">파일 선택</span><input type="file"/></label></div><div class="field"><label for="concern">현재 가장 고민되는 부분은 무엇인가요?</label><textarea class="textarea" id="concern" name="concern" minLength="100" placeholder="100자 이상 입력하세요." aria-invalid="false"></textarea><div class="field-meta"><p class="character-count" aria-live="polite">0<!-- -->/100</p></div></div><div class="field" role="group" aria-labelledby="commitment-label" aria-invalid="false" tabindex="-1"><p class="field-label" id="commitment-label">4주 동안 매주 포트폴리오를 수정할 시간을 확보할 수 있나요?</p><div class="choice-list"><label class="choice"><span>가능해요.</span><input type="radio" name="commitment" value="가능해요."/></label><label class="choice"><span>어려울 수도 있어요.</span><input type="radio" name="commitment" value="어려울 수도 있어요."/></label></div></div><div class="field" role="group" aria-labelledby="conditions-label" aria-invalid="false" tabindex="-1"><p class="field-label" id="conditions-label">참여 조건을 확인해 주세요.</p><div class="choice-list"><label class="choice"><span>오프라인 참석 가능합니다.</span><input type="checkbox" name="conditions" value="오프라인 참석 가능합니다."/></label><label class="choice"><span>기존 포트폴리오가 있습니다.</span><input type="checkbox" name="conditions" value="기존 포트폴리오가 있습니다."/></label><label class="choice"><span>매주 피드백을 반영하여 수정하겠습니다.</span><input type="checkbox" name="conditions" value="매주 피드백을 반영하여 수정하겠습니다."/></label></div></div><div class="field" role="group" aria-labelledby="availability-label" aria-invalid="false" tabindex="-1"><p class="field-label" id="availability-label">가능한 시간대를 모두 선택해 주세요.</p><div class="choice-grid"><label class="choice"><span>월요일 19:30 ~ 22:00</span><input type="checkbox" name="availability" value="월요일 19:30 ~ 22:00"/></label><label class="choice"><span>수요일 19:30 ~ 22:00</span><input type="checkbox" name="availability" value="수요일 19:30 ~ 22:00"/></label><label class="choice"><span>목요일 19:30 ~ 22:00</span><input type="checkbox" name="availability" value="목요일 19:30 ~ 22:00"/></label><label class="choice"><span>금요일 19:30 ~ 22:00</span><input type="checkbox" name="availability" value="금요일 19:30 ~ 22:00"/></label><label class="choice"><span>토요일 10:00 ~ 12:30</span><input type="checkbox" name="availability" value="토요일 10:00 ~ 12:30"/></label><label class="choice"><span>토요일 14:00 ~ 16:30</span><input type="checkbox" name="availability" value="토요일 14:00 ~ 16:30"/></label><label class="choice"><span>토요일 18:00 ~ 20:30</span><input type="checkbox" name="availability" value="토요일 18:00 ~ 20:30"/></label><label class="choice"><span>일요일 10:00 ~ 12:30</span><input type="checkbox" name="availability" value="일요일 10:00 ~ 12:30"/></label><label class="choice"><span>일요일 14:00 ~ 16:30</span><input type="checkbox" name="availability" value="일요일 14:00 ~ 16:30"/></label><label class="choice"><span>일요일 18:00 ~ 20:30</span><input type="checkbox" name="availability" value="일요일 18:00 ~ 20:30"/></label></div></div><div class="form-submit-slot"><div class="form-submit"><button class="submit-button" type="submit">신청서 제출하기</button></div></div></form></div></main><script>(() => {
  const form = document.querySelector(".application-form");
  if (!form) return;
  const apiUrl = "https://portfolio-workshop-1.jayyoungjunkim.chatgpt.site/api/applications";
  const maxFileSize = 20 * 1024 * 1024;
  const fileInput = form.querySelector('input[type="file"]');
  const upload = form.querySelector(".upload");
  const uploadCopy = form.querySelector(".upload-copy > span:first-child");
  const uploadNote = form.querySelector(".upload-note");
  const concern = form.querySelector('[name="concern"]');
  const characterCount = form.querySelector(".character-count");
  const submitButton = form.querySelector('.submit-button');

  const fieldFor = name => form.querySelector('[name="' + name + '"]')?.closest(".field") || form.querySelector('[aria-labelledby="' + name + '-label"]');
  const clearError = name => {
    const field = fieldFor(name);
    field?.removeAttribute("aria-invalid");
    field?.querySelector('[data-error-for="' + name + '"]')?.remove();
  };
  const showError = (name, message) => {
    const field = fieldFor(name);
    if (!field) return;
    clearError(name);
    field.setAttribute("aria-invalid", "true");
    const error = document.createElement("p");
    error.className = "error-text";
    error.dataset.errorFor = name;
    error.setAttribute("role", "alert");
    error.textContent = message;
    field.append(error);
  };
  const clearSubmitError = () => form.querySelector('[data-error-for="submit"]')?.remove();
  const showSubmitError = message => {
    clearSubmitError();
    const error = document.createElement("p");
    error.className = "error-text";
    error.dataset.errorFor = "submit";
    error.setAttribute("role", "alert");
    error.textContent = message;
    submitButton.closest(".form-submit-slot").before(error);
  };

  form.addEventListener("input", event => {
    const name = event.target.name;
    if (name) clearError(name === "portfolioLink" ? "portfolio" : name);
    if (event.target === concern && characterCount) characterCount.textContent = concern.value.length + "/100";
  });
  form.addEventListener("change", event => {
    const name = event.target.name;
    if (name) clearError(name);
  });
  fileInput?.addEventListener("change", () => {
    const file = fileInput.files?.[0];
    clearError("portfolio");
    if (!file) return;
    if (file.size > maxFileSize) {
      fileInput.value = "";
      showError("portfolio", "파일 용량은 최대 20MB까지 첨부할 수 있습니다.");
      return;
    }
    if (uploadCopy) uploadCopy.textContent = file.name;
    if (uploadNote) uploadNote.textContent = "파일이 첨부되었습니다.";
  });
  upload?.addEventListener("dragover", event => { event.preventDefault(); upload.classList.add("is-dragging"); });
  upload?.addEventListener("dragleave", () => upload.classList.remove("is-dragging"));
  upload?.addEventListener("drop", event => {
    event.preventDefault(); upload.classList.remove("is-dragging");
    if (event.dataTransfer.files?.[0] && fileInput) {
      const transfer = new DataTransfer(); transfer.items.add(event.dataTransfer.files[0]);
      fileInput.files = transfer.files; fileInput.dispatchEvent(new Event("change", {bubbles:true}));
    }
  });

  const uploadPortfolio = async (file, uploadUrl) => {
    const headers = {"content-type": file.type || "application/octet-stream"};
    try {
      const response = await fetch(uploadUrl, {method:"PUT", headers, body:file});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.id) throw new Error(result.error?.message || "포트폴리오 파일 업로드에 실패했습니다.");
      return {id:result.id,name:result.name||file.name,url:result.webViewLink||"https://drive.google.com/open?id="+result.id,size:file.size,type:file.type||"application/octet-stream"};
    } catch (error) {
      if (!(error instanceof TypeError)) throw error;
      const response = await fetch(apiUrl, {method:"PUT",credentials:"include",headers:{...headers,"x-file-size":String(file.size),"x-upload-session":uploadUrl},body:file});
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.file) throw new Error(result.error || "포트폴리오 파일 업로드에 실패했습니다.");
      return result.file;
    }
  };

  form.addEventListener("submit", async event => {
    event.preventDefault();
    const data = new FormData(form);
    const file = fileInput?.files?.[0] || null;
    const conditions = data.getAll("conditions").map(String);
    const availability = data.getAll("availability").map(String);
    const values = {
      name:String(data.get("name")||"").trim(), phone:String(data.get("phone")||"").trim(), email:String(data.get("email")||"").trim(),
      career:String(data.get("career")||""), portfolioLink:String(data.get("portfolioLink")||"").trim(), concern:String(data.get("concern")||"").trim(),
      commitment:String(data.get("commitment")||""), conditions, availability,
    };
    form.querySelectorAll("[data-error-for]").forEach(error => error.remove());
    const errors = [];
    if (!values.name) errors.push(["name","이름을 입력해 주세요."]);
    if (!values.phone) errors.push(["phone","연락처를 입력해 주세요."]);
    if (!values.email) errors.push(["email","이메일을 입력해 주세요."]);
    if (!values.career) errors.push(["career","현재 경력을 선택해 주세요."]);
    if (!values.portfolioLink && !file) errors.push(["portfolio","포트폴리오 링크를 입력하거나 파일을 첨부해 주세요."]);
    if (values.concern.length < 100) errors.push(["concern","현재 고민되는 부분을 100자 이상 입력해 주세요."]);
    if (!values.commitment) errors.push(["commitment","포트폴리오 수정 가능 여부를 선택해 주세요."]);
    if (conditions.length !== 3) errors.push(["conditions","참여 조건을 모두 확인하고 선택해 주세요."]);
    if (availability.length === 0) errors.push(["availability","가능한 시간대를 한 개 이상 선택해 주세요."]);
    errors.forEach(([name,message]) => showError(name,message));
    if (errors.length) { fieldFor(errors[0][0])?.scrollIntoView({behavior:"smooth",block:"center"}); return; }

    clearSubmitError(); submitButton.disabled = true;
    submitButton.innerHTML = '<span class="submitting-label">제출 중<span class="submitting-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></span>';
    try {
      let storedFile = null;
      if (file) {
        const initResponse = await fetch(apiUrl, {method:"POST",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify({action:"initUpload",name:file.name,type:file.type||"application/octet-stream",size:file.size,applicantName:values.name})});
        const initResult = await initResponse.json().catch(() => ({}));
        if (!initResponse.ok || !initResult.uploadUrl) throw new Error(initResult.error || "파일 업로드를 준비하지 못했습니다.");
        storedFile = await uploadPortfolio(file, initResult.uploadUrl);
      }
      const response = await fetch(apiUrl, {method:"POST",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify({...values,file:storedFile})});
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "신청서를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
      location.assign("/apply/complete/");
    } catch (error) {
      showSubmitError(error instanceof Error ? error.message : "신청서를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
      submitButton.disabled = false; submitButton.textContent = "신청서 제출하기";
    }
  });

  const slot = form.querySelector(".form-submit-slot");
  const sticky = slot?.querySelector(".form-submit");
  if (slot && sticky) {
    const update = () => sticky.classList.toggle("is-docked", slot.getBoundingClientRect().top <= innerHeight - slot.offsetHeight - 20);
    update(); addEventListener("scroll", update, {passive:true}); addEventListener("resize", update);
  }
})();</script></body></html>
